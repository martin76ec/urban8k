[project]
name = "urban8k-ctransformer"
version = "0.1.0"
description = "CNN + Transformer encoder for UrbanSound8K classification"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.9,<2.10",
    "soundfile",
    "numpy",
    "pyyaml",
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "seaborn",
]

# CUDA 12.8 wheels (driver 570.x supports up to CUDA 12.8).
# Use the dedicated PyTorch index on Linux so uv selects the cu128 build of
# torch. On macOS (dev) it falls back to PyPI CPU wheels. torchaudio is NOT
# used (its torchcodec backend breaks on CUDA 12.8); audio I/O uses soundfile
# and the log-Mel spectrogram is computed with pure torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban8k_ctransformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: fast CPU-only tests with synthetic tensors",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["urban8k_ctransformer"]

[[tool.mypy.overrides]]
module = ["torchaudio.*", "matplotlib.*", "seaborn.*", "sklearn.*", "tqdm.*", "soundfile"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy"]
# numpy ships its own .pyi that uses 3.12-only syntax; disable strict on it.
follow_imports = "skip"